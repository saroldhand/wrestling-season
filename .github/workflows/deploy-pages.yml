# OPT-IN GitHub Pages deploy — run manually from the Actions tab.
#
# Read §7 of the build spec before enabling: a GitHub Pages site is publicly
# reachable on the internet EVEN IF this repository is private. That is a
# defensible tradeoff for the technique library and practice structure; it is
# not defensible for roster data. content/private/ is gitignored and never
# built, so keep it that way.
#
# The recommended private alternative is Cloudflare Pages + Cloudflare
# Access (email-allowlist the staff): connect the repo in the Cloudflare
# dashboard with build command `npm run build` and output dir `dist`, then
# put an Access policy in front of the pages.dev domain. No workflow needed.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
