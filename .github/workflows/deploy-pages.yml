# GitHub Pages deploy.
#
# Heads-up (§7 of the build spec): a GitHub Pages site is publicly reachable
# on the internet EVEN IF this repository is private. That is a defensible
# tradeoff for the technique library and practice structure; it is not
# defensible for roster data. content/private/ is gitignored and never
# built — keep it that way.
#
# The private alternative is Cloudflare Pages + Cloudflare Access
# (email-allowlist the staff): connect the repo in the Cloudflare dashboard
# with build command `npm run build` and output dir `dist`, then put an
# Access policy in front of the pages.dev domain. No workflow needed.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, claude/wrestling-hq-build-qgjc0w]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      # A custom domain (CNAME file in the repo root) serves from the domain
      # root; the default github.io project site serves under /<repo>/.
      # Every internal URL goes through BASE_PATH (astro.config.mjs +
      # src/lib/url.ts), so one variable switches between the two.
      - name: Resolve base path
        id: base
        run: |
          if [ -f CNAME ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "Custom domain $(cat CNAME) — building for the domain root"
          else
            echo "base=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
            echo "No CNAME — building for /${{ github.event.repository.name }}/"
          fi
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.base }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
