name: CI

on:
  push:
  pull_request:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # the content gate: schema + referential integrity + season rules
      - run: npm run validate

      # the build enforces the same schemas again and renders every page
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7
